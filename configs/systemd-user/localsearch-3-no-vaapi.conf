# The desktop file indexer (localsearch, formerly Tracker) extracts metadata
# from every video it finds, and on this iMac it does so through the GPU's
# video engine (VA-API). That engine hangs the GPU on this machine -- the same
# VCE hang that makes hardware video encode unusable -- and the indexer reaches
# it unattended, in the background, and takes the whole machine down. Deny the
# indexer a VA-API driver so it falls back to software; nothing else changes.
[Service]
Environment=LIBVA_DRIVER_NAME=null
