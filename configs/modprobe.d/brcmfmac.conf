# iMac18,3 Wi-Fi (Broadcom BCM43602, brcmfmac). Bit 13 = FWSUP, bit 19 = SAE:
# stop the firmware doing the WPA handshake itself and offering WPA3-SAE.
# With them on, this chip's firmware handles the 4-way handshake and fails to
# associate on common WPA2/WPA3-mixed networks; with them off, the handshake is
# done by the host supplicant (iwd/wpa_supplicant) and it just works. WPA3-only
# networks are not available with this set.
options brcmfmac feature_disable=0x82000
