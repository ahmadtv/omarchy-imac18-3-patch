# Copy to ~/.config/pipewire/filter-chain.conf.d/eq6.conf
# Then: systemctl --user enable --now filter-chain.service
# Then set "iMac Speaker EQ" as your default output (wpctl status / your sound settings).
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "iMac Speaker EQ"
            media.name       = "iMac Speaker EQ"
            filter.graph = {
                nodes = [
                    { type = builtin name = eq_band_1 label = bq_lowshelf
                      control = { "Freq" = 150.0 "Q" = 0.7 "Gain" = 7.0 } }
                    { type = builtin name = eq_band_2 label = bq_peaking
                      control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = 2.0 } }
                    { type = builtin name = eq_band_3 label = bq_peaking
                      control = { "Freq" = 500.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_4 label = bq_peaking
                      control = { "Freq" = 2000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_5 label = bq_peaking
                      control = { "Freq" = 5000.0 "Q" = 1.0 "Gain" = -2.0 } }
                    { type = builtin name = eq_band_6 label = bq_highshelf
                      control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = -3.0 } }
                    { type = builtin name = eq_band_7 label = clamp
                      control = { "Min" = -0.98 "Max" = 0.98 } }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props  = { node.name = "effect_input.eq6"  media.class = Audio/Sink }
            playback.props = { node.name = "effect_output.eq6" node.passive = true }
        }
    }
]
