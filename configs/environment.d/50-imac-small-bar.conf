# iMac18,3: the Radeon Pro exposes only a 256 MiB CPU-visible slice of its
# video memory (Polaris, no large BAR). ggml's Vulkan backend -- inside voxtype
# and most local speech/LLM tools -- parks buffers in that slice by default and
# can fill it, after which the shutdown splash cannot allocate its framebuffer
# and the machine freezes at the Omarchy logo on reboot. This is ggml's own
# switch for small-BAR GPUs; it moves those buffers to ordinary video memory.
# Loaded into the user session, so every such tool picks it up.
GGML_VK_DISABLE_HOST_VISIBLE_VIDMEM=1
