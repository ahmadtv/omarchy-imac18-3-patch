# DRAFT — not installed.   Target: /etc/modprobe.d/imac-igpu.conf
#
# DURING TESTING, do not install this file: put the same options on the set_os
# test entry's kernel command line instead (module.param=value is honoured for
# modules loaded later from the root fs), so the known-good default entry sees
# no change at all:
#   i915.disable_display=1 i915.vbt_firmware=imac18-3/headless-vbt.bin snd_hda_intel.probe_mask=1,1
# Install this file only once the iGPU entry becomes the everyday default.
# On boots where firmware hides the iGPU these lines are inert (i915 never
# binds; both HDA controllers only have a codec at address 0).
#
# --- i915 (Intel HD 630, 00:02.0) -------------------------------------------
# disable_display=1: display stays "present" (HAS_DISPLAY), so i915 still takes
#   over the display engine, loads DMC (i915/kbl_dmc_ver1_04.bin), allows DC5/DC6
#   (enable_dc=-1 -> DC6 on display ver 9) and turns unused power wells off, but
#   every connector detect returns "disconnected" and HPD polling is off
#   (intel_display_device_enabled() in intel_dp.c, intel_hdmi.c, intel_dp_mst.c,
#   intel_hotplug.c). Not an "unsafe" param: no kernel taint.
# vbt_firmware=...: a VBT with no child devices, so no DDI encoder/connector is
#   created at all -- no eDP probe, no AUX, no panel power sequencing on DDI A.
#   File: ../vbt/headless-vbt.bin -> /usr/lib/firmware/imac18-3/headless-vbt.bin
#   If the file is missing, i915 logs "Requesting VBT firmware ... failed" and
#   falls back to its invented VBT (eDP on port A) -- i.e. disable_display alone.
options i915 disable_display=1 vbt_firmware=imac18-3/headless-vbt.bin

# Stage 2 only, on its own test boot: HuC for low-power (VDEnc) H.264 bitrate
# control. enable_guc is module_param_named_unsafe -> taints the kernel ('U').
# Loads kbl_guc_70.1.1 only to authenticate kbl_huc_4.0.0; gen9 keeps execlist
# submission. A GuC upload failure makes i915 return -EIO and wedge the GT
# (no render/encode until reboot) -- see README section 1.
#options i915 enable_guc=2

# --- snd_hda_intel ------------------------------------------------------------
# Probe only codec slot 0 on each HD-Audio controller. PCH (00:1f.3): slot 0 is
# the CS8409; the Intel display-audio codec (slot 2 when the iGPU is present) is
# skipped. Radeon HDMI (01:00.1): its codec is also slot 0. The array is indexed
# by probe order, which becomes unpredictable once the PCH controller defers
# its probe until i915 has bound -- hence the same value for both slots.
# Documentation/sound/hd-audio/notes.rst ("probe_mask").
options snd_hda_intel probe_mask=1,1
