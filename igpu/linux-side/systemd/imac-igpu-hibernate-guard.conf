# DRAFT — not installed.
# Target (only if hibernation is ever un-masked -- today hibernate.target,
# hybrid-sleep.target and suspend-then-hibernate.target are symlinked to
# /dev/null, so nothing can hibernate):
#   /etc/systemd/system/systemd-hibernate.service.d/imac-igpu-guard.conf
#   /etc/systemd/system/systemd-hybrid-sleep.service.d/imac-igpu-guard.conf
#   /etc/systemd/system/systemd-suspend-then-hibernate.service.d/imac-igpu-guard.conf
#
# Refuse to hibernate while the Intel iGPU is visible, as long as boots with and
# without set_os share one resume= swapfile. A hibernation image freezes the
# kernel's view of the PCI bus; it has to be resumed by a boot whose firmware
# exposes the same devices. If an image taken with i915 bound is resumed on a
# default boot (iGPU hidden again), the restored i915 and the HDA controller
# bound to it through the audio component talk to a function that no longer
# decodes (config reads 0xffff): expect i915 resume errors/wedge and a stuck
# PCH audio controller. The reverse (image without the iGPU, resumed with it
# exposed) leaves 00:02.0 undriven -- no crash, but the GT never reaches RC6
# until the next real boot.
#
# A failing ExecStartPre fails the service, so `systemctl hibernate` reports
# an error and the machine stays up.

[Service]
ExecStartPre=/bin/sh -c 'if [ -e /sys/bus/pci/devices/0000:00:02.0 ]; then echo "imac: iGPU exposed (set_os boot); hibernation disabled on this boot" >&2; exit 1; fi'
