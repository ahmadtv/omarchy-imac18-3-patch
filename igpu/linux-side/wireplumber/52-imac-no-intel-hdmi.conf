# DRAFT — not installed.
# Target: ~/.config/wireplumber/wireplumber.conf.d/52-imac-no-intel-hdmi.conf
# (next to 51-imac-audio-names.conf; restart: systemctl --user restart wireplumber)
#
# Second line of defence only. The primary guard is the kernel option
# snd_hda_intel probe_mask=1,1 (see ../modprobe.d/imac-igpu.conf), which keeps
# the Intel display-audio codec from being probed at all; with it in place this
# rule matches nothing.
#
# Why a rule is needed at all: on Skylake/Kaby Lake the iGPU's HDMI/DP audio
# codec ("Intel Kabylake HDMI", usually codec address 2) sits on the SAME PCH
# HD-Audio link (00:1f.3) as the CS8409 -- so it becomes part of the same ALSA
# card and the same PipeWire device, alsa_card.pci-0000_00_1f.3. Disabling that
# device would take the speakers, headphones and microphone with it. What can
# be switched off safely is any HDMI *node* that a combined ACP profile
# (e.g. output:analog-stereo+output:hdmi-stereo) would create on that card.
# The iMac's HD 630 has no display outputs wired, so these sinks could only
# ever be silent.
#
# The card's profile itself is already pinned by WirePlumber's state file
# (~/.local/state/wireplumber/default-profile:
#  alsa_card.pci-0000_00_1f.3=output:analog-stereo+input:analog-stereo),
# and HDMI ports without an ELD are "not available", so the policy would not
# pick them on its own.
#
# The Radeon's own HDMI audio (01:00.1, alsa_card.pci-0000_01_00.1) is a
# different card and is not touched.

monitor.alsa.rules = [
  {
    matches = [
      # regex ('~'); unescaped dots also match the literal dots in the name
      { node.name = "~alsa_output.pci-0000_00_1f.3.*hdmi.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
