# DRAFT — not installed.   Target: /etc/mkinitcpio.conf.d/zz-imac-no-kms-hook.conf
#
# Keep i915 (and its 49 firmware files) out of every initramfs, so the HD 630
# can never take part in early KMS, Plymouth or fbcon, is always probed from
# the root fs *after* amdgpu, and always sees its vbt_firmware file.
#
# Why this is needed: the `kms` hook adds GPU drivers with
#   map add_checked_modules '/drivers/char/agp/' '/drivers/gpu/drm/'
# (/usr/lib/initcpio/install/kms). With `autodetect` earlier in HOOKS, that is
# filtered to the modules whose MODALIAS/DRIVER is present in /sys at build
# time. So the image content depends on the boot you build it from:
#   * today (iGPU hidden): no i915;
#   * any mkinitcpio run while booted with set_os (a pacman kernel update, the
#     patched-amdgpu rebuild, limine-update) would add i915 -- to the image the
#     default entry uses too;
#   * the fallback image (built without autodetect) already gets every DRM
#     driver: i915.ko + 49 i915 firmware files (measured, see README).
#
# amdgpu does not depend on the kms hook here: /etc/mkinitcpio.conf has
# MODULES=(amdgpu), and add_module also pulls in its firmware.
# Measured on 2026-09-11, kernel 7.2.3-arch1-3, current (iGPU hidden) boot:
#   mkinitcpio -g base.img   vs   mkinitcpio -S kms -g nokms.img
#   -> identical file lists (376 modules, 57,797,962 bytes both).
#   Fallback-style (-S autodetect): 1 i915.ko + 49 i915 fw files; with
#   -S autodetect,kms: 0 and 0, amdgpu still present.
# So installing this changes nothing in today's images.
#
# Omarchy itself drops `kms` the same way on NVIDIA-only machines
# (/etc/mkinitcpio.conf.d/omarchy_hooks.conf). The file name sorts after
# omarchy_hooks.conf, omarchy_resume.conf and thunderbolt_module.conf, so it
# acts on the final HOOKS array.
#
# After installing: limine-mkinitcpio (the /usr/local/bin/mkinitcpio wrapper
# offers it), then check with   sudo lsinitcpio -a <image> | grep -i -E 'i915|amdgpu'
# (images live under /boot, which is root-only).

_imac_hooks=()
for _imac_hook in "${HOOKS[@]}"; do
  [[ $_imac_hook == "kms" ]] || _imac_hooks+=("$_imac_hook")
done
HOOKS=("${_imac_hooks[@]}")
unset _imac_hooks _imac_hook
