# /etc/mkinitcpio.conf.d/zz-imac-igpu.conf -- iMac18,3 with the Intel HD 630 exposed.
# Sorted last, so it runs after the other drop-ins have filled MODULES.
#
# i915 loads before amdgpu, so the HD 630 registers first and becomes renderD128:
# every app that takes "the first GPU" for video (ffmpeg, GStreamer, Strata, OBS's
# default) lands on Quick Sync; the desktop is pinned to the Radeon by name
# (AQ_DRM_DEVICES=/dev/dri/amd-card), and display-bound apps follow the compositor.
# The no-outputs VBT must be inside the initramfs, because i915 now loads from it:
# without it i915 invents an eDP panel on port A (init_vbt_missing_defaults).
# On boots where the firmware hides the iGPU, i915 loads and finds no device.
MODULES=(i915 "${MODULES[@]}")
FILES+=(/usr/lib/firmware/imac18-3/headless-vbt.bin)
# The SMBus-enable rule must run in the initramfs, before systemd-backlight.
FILES+=(/etc/udev/rules.d/62-imac-smbus-acpi.rules)
# Full brightness range: the upgraded PEG0GFX0 SSDT from acpi/make-bcl100
# (/etc/initcpio/acpi_override/imac-bcl100.aml). The hook fails the build if
# no .aml exists, so run make-bcl100 before enabling it.
HOOKS+=(acpi_override)
