# Readable names for the iMac18,3 codec.
#
# WirePlumber publishes this device as "CS8409/CS42L83 Analog" -- the codec part
# number, which tells a user nothing. The shell prefers a node's nickname over
# its description, so overriding the nickname is what actually changes the label
# in the volume panel.
#
# The output is "iMac Audio" rather than "iMac Speakers": speakers and headphones
# are two ports on this one device, so it is the same entry whether or not
# something is plugged into the jack, and naming it for either port would be
# wrong half the time. The ports themselves are listed by name in the panel.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*analog-stereo" } ]
    actions = {
      update-props = {
        node.nick        = "iMac Audio"
        node.description = "iMac Audio"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.*analog-stereo" } ]
    actions = {
      update-props = {
        node.nick        = "iMac Microphone"
        node.description = "iMac Microphone"
      }
    }
  }
]
