# Readable names for the iMac18,3 codec.
#
# WirePlumber publishes this device as "CS8409/CS42L83 Analog" -- the codec part
# number, which tells a user nothing. The shell prefers a node's nickname over
# its description, so overriding the nickname is what actually changes the label
# in the volume panel.
#
# The output keeps "(no EQ)" in its name on purpose. Speakers and headphones are
# two ports on this one device, so it is the same entry whether or not something
# is plugged into the jack; what distinguishes it from the tuned sink beside it
# is not the transducer but the absence of the speaker EQ. Naming it for the
# port would be wrong half the time.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*analog-stereo" } ]
    actions = {
      update-props = {
        node.nick        = "iMac Direct (no EQ)"
        node.description = "iMac Direct (no EQ)"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.*analog-stereo" } ]
    actions = {
      update-props = {
        node.nick        = "iMac Microphone"
        node.description = "iMac Microphone"
      }
    }
  }
]
